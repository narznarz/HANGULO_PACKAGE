name: daily-stats
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: update stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, re, urllib.request
          from datetime import datetime, timezone
          def get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {"User-Agent": "hangulo-stats/1.0"})
              return urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
          out = {}
          try:
              html = get("https://extensions.blender.org/themes/oled/")
              m = re.search(r"Downloads[\s\S]*?</dt>\s*<dd>(\d+)</dd>", html)
              if m: out["blender_downloads"] = int(m.group(1))
          except Exception as e:
              print("blender fail:", e)
          try:
              import os
              h = {"User-Agent": "hangulo-stats/1.0"}
              tok = os.environ.get("GH_TOKEN")
              if tok: h["Authorization"] = "Bearer " + tok
              total, page = 0, 1
              while True:
                  rels = json.loads(get(f"https://api.github.com/repos/narznarz/HANGULO_PACKAGE/releases?per_page=100&page={page}", h))
                  if not rels: break
                  for r in rels:
                      for a in r.get("assets", []):
                          total += a.get("download_count", 0) or 0
                  page += 1
              out["github_downloads"] = total
          except Exception as e:
              print("github fail:", e)
          out["updated"] = datetime.now(timezone.utc).isoformat(timespec="seconds")
          prev = {}
          try: prev = json.load(open("feed/stats.json", encoding="utf-8"))
          except Exception: pass
          if {k: v for k, v in prev.items() if k != "updated"} != {k: v for k, v in out.items() if k != "updated"}:
              json.dump(out, open("feed/stats.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
              print("updated:", out)
          else:
              print("no change")
          EOF
      - name: commit
        run: |
          git config user.name "hangulo-stats"
          git config user.email "hangulo-stats@users.noreply.github.com"
          git add feed/stats.json
          git diff --cached --quiet || (git commit -m "stats: daily download counts" && git push)