name: daily-stats
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install curl_cffi
      - name: update stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          python3 - <<'EOF'
          import inspect, dataclasses, json, re, secrets, urllib.request
          from datetime import datetime, timezone
          def get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {"User-Agent": "hangulo-stats/1.0"})
              return urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
          try: prev = json.load(open("feed/stats.json", encoding="utf-8"))
          except Exception: prev = {}
          out = dict(prev)
          try:
              html = get("https://extensions.blender.org/themes/oled/")
              m = re.search(r"Downloads[\s\S]*?</dt>\s*<dd>(\d+)</dd>", html)
              if m: out["blender_downloads"] = int(m.group(1))
          except Exception as e:
              print("blender fail:", e)
          try:
              import os
              h = {"User-Agent": "hangulo-stats/1.0"}
              tok = os.environ.get("GH_TOKEN")
              if tok: h["Authorization"] = "Bearer " + tok
              total, page = 0, 1
              while True:
                  rels = json.loads(get(f"https://api.github.com/repos/narznarz/HANGULO_PACKAGE/releases?per_page=100&page={page}", h))
                  if not rels: break
                  for r in rels:
                      for a in r.get("assets", []):
                          total += a.get("download_count", 0) or 0
                  page += 1
              out["github_downloads"] = max(int(prev.get("github_downloads") or 0), total)
          except Exception as e:
              print("github fail:", e)
          TRUE_PROVIDERS = {"BarcelonaHasCommunities","BarcelonaHasCommunitiesOrLoggedOut",
              "BarcelonaHasCommunityEmojiUpdateCard","BarcelonaHasDearAlgoConsumption",
              "BarcelonaHasGameScoreShare","BarcelonaHasMusic","BarcelonaHasPodcastTranscriptConsumption",
              "BarcelonaHasPodcastV2Consumption"}
          HOVER_PROVIDERS = ["BarcelonaIsInternalUser","BarcelonaIsLoggedIn","BarcelonaHasMessaging",
              "BarcelonaMessagesHasLiveChatMessaging","BarcelonaShouldShowFediverseM1Features","BarcelonaHasEventBadge"]
          try:
              from curl_cffi import requests as cr
              csrf = secrets.token_urlsafe(24)[:32]
              lsd = "AV" + secrets.token_urlsafe(7)[:9]
              s = cr.Session(impersonate="chrome")
              s.cookies.set("csrftoken", csrf, domain=".threads.com")
              variables = {"username": "narz.cg"}
              for p in HOVER_PROVIDERS:
                  variables["__relay_internal__pv__" + p + "relayprovider"] = p in TRUE_PROVIDERS
              body = {"lsd": lsd, "doc_id": "28097126603320603",
                  "variables": json.dumps(variables, separators=(",", ":")),
                  "fb_api_req_friendly_name": "BarcelonaUsernameHovercardImplDirectQuery",
                  "fb_api_caller_class": "RelayModern", "server_timestamps": "true",
                  "__a": "1", "__comet_req": "29", "__user": "0", "av": "0"}
              headers = {"accept": "*/*", "accept-language": "en-US,en;q=0.9",
                  "content-type": "application/x-www-form-urlencoded", "origin": "https://www.threads.com",
                  "referer": "https://www.threads.com/", "x-asbd-id": "359341", "x-csrftoken": csrf,
                  "x-fb-friendly-name": "BarcelonaUsernameHovercardImplDirectQuery",
                  "x-fb-lsd": lsd, "x-ig-app-id": "238260118697367",
                  "x-logged-out-threads-migrated-request": "true",
                  "x-root-field-name": "xdt_text_app_user_by_username"}
              r = s.post("https://www.threads.com/graphql/query", data=body, headers=headers, timeout=30)
              u = (r.json().get("data") or {}).get("user") or {}
              if isinstance(u.get("follower_count"), int):
                  out["threads_followers"] = u["follower_count"]
                  print("threads:", u["follower_count"])
              else:
                  print("threads: no count, status", r.status_code)
          except Exception as e:
              print("threads fail:", e)
          try:
              import os
              ig_tok = os.environ.get("IG_TOKEN")
              if ig_tok:
                  ig_raw = get(f"https://graph.facebook.com/v21.0/17841457368833553?fields=followers_count,media_count&access_token={ig_tok}")
                  ig = json.loads(ig_raw.lstrip("\ufeff"))
                  if isinstance(ig.get("followers_count"), int):
                      out["instagram_followers"] = int(ig["followers_count"])
                      if isinstance(ig.get("media_count"), int):
                          out["instagram_media_count"] = int(ig["media_count"])
                      print("instagram:", ig["followers_count"], "media:", ig.get("media_count"))
                  else:
                      print("instagram: no count", ig)
              else:
                  print("instagram: no token")
          except Exception as e:
              print("instagram fail:", e)
          try:
              import os
              hh = {"User-Agent": "hangulo-stats/1.0"}
              tk = os.environ.get("GH_TOKEN")
              if tk: hh["Authorization"] = "Bearer " + tk
              hrels = json.loads(get("https://api.github.com/repos/narznarz/HANGULO_PACKAGE/releases?per_page=100", hh))
              cand = [r for r in hrels if r.get("tag_name","").startswith("haptics-v") and not r.get("draft") and not r.get("prerelease")]
              if cand:
                  top = max(cand, key=lambda r: r.get("published_at",""))
                  ver = top["tag_name"].split("haptics-v", 1)[1]
                  exe = next((a["browser_download_url"] for a in top.get("assets", []) if a.get("name","").endswith("-setup.exe")), "")
                  try: ex = json.load(open("feed/extra.json", encoding="utf-8"))
                  except Exception: ex = {}
                  if exe and (ex.get("hapticsVersion") != ver or ex.get("hapticsUrl") != exe):
                      ex["hapticsVersion"] = ver
                      ex["hapticsUrl"] = exe
                      json.dump(ex, open("feed/extra.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
                      print("haptics:", ver, exe)
                  else:
                      print("haptics: no change", ver)
          except Exception as e:
              print("haptics fail:", e)
          try:
              import os
              tv_tok = os.environ.get("THREADS_TOKEN")
              if tv_tok:
                  uid = json.loads(get(f"https://graph.threads.net/v1.0/me?fields=id&access_token={tv_tok}")).get("id")
                  total_v, seen = 0, 0
                  nxt = f"https://graph.threads.net/v1.0/{uid}/threads?fields=id,insights.metric(views)&limit=100&access_token={tv_tok}"
                  while nxt and seen < 2000:
                      d = json.loads(get(nxt))
                      for m in d.get("data", []):
                          seen += 1
                          for x in (m.get("insights") or {}).get("data", []):
                              if x.get("name") == "views":
                                  vals = x.get("values") or [{}]
                                  total_v += int(vals[0].get("value") or 0)
                      nxt = (d.get("paging") or {}).get("next")
                  out["threads_views"] = max(int(prev.get("threads_views") or 0), total_v)
                  out["threads_posts"] = seen
                  print("threads views:", total_v, "posts:", seen)
              else:
                  print("threads views: no token")
          except Exception as e:
              print("threads views fail:", e)
          out["updated"] = datetime.now(timezone.utc).isoformat(timespec="seconds")
          if {k: v for k, v in prev.items() if k != "updated"} != {k: v for k, v in out.items() if k != "updated"}:
              json.dump(out, open("feed/stats.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
              print("updated:", out)
          else:
              print("no change")
          EOF
      - name: commit
        run: |
          git config user.name "hangulo-stats"
          git config user.email "hangulo-stats@users.noreply.github.com"
          git add feed/stats.json feed/extra.json
          git diff --cached --quiet || (git commit -m "stats: daily counts + haptics version" && git push)